    <style>
      .boot-skeleton { min-height: 100vh; background: var(--boot-bg, #f7f6f2); }
      :root[data-theme="dark"] .boot-skeleton { --boot-bg: #000; --boot-bar: #1a1a1a; }
      .boot-bar { height: 64px; border-bottom: 1px solid rgba(128,128,128,.25); display: flex; align-items: center; gap: 12px; padding: 0 20px; }
      .boot-block { background: var(--boot-bar, #e6e4dc); animation: boot-pulse 1.3s ease-in-out infinite; }
      .boot-body { display: grid; gap: 16px; padding: 28px 20px; max-width: 900px; }
      @keyframes boot-pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .boot-block { animation: none; } }
    </style>

    <div id="root"><div class="boot-skeleton" aria-hidden="true"><div class="boot-bar"><span class="boot-block" style="width:40px;height:40px;border-radius:50%"></span><span class="boot-block" style="width:160px;height:14px"></span></div><div class="boot-body"><span class="boot-block" style="width:60%;height:34px"></span><span class="boot-block" style="width:85%;height:14px"></span><span class="boot-block" style="width:100%;height:240px"></span></div></div></div>
